name: Scholar Metrics Sync

on:
  schedule:
    # daily at 03:23 UTC
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          METRICS_OUT: assets/data/metrics.json
        run: python tools/fetch-scholar.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/metrics.json
          if git diff --cached --quiet; then
            echo "No change in metrics"
          else
            git commit -m "chore: update Scholar metrics"
            git push
          fi
